# agentpipe configuration. Launch one target at a time:  agentpipe run <target>

claude_bin = "~/.local/bin/claude.exe"
gh_bin = "E:/Programs/GitHubCLI/bin/gh.exe"
# Worktrees, logs, plans, state and cargo target dirs, one folder per target.
work_root = "E:/Source/.pipeline"

[run]
max_implementers = 5     # parallel implementer agents (each builds in its own cargo target dir)
max_reviewers = 3
max_rounds = 3            # rejections before a task goes to "needs decision"
poll_seconds = 60         # how often GitHub is checked
sync_seconds = 600        # how often tasks.md is re-read and issues reconciled
limit_backoff_seconds = 1800  # pause after a usage/capacity limit (or until the window resets, if known)
# Start nothing new once a usage window reaches this share; resume when it resets.
# Running jobs finish, so the gap below 1.0 is their headroom.
throttle = { five_hour = 0.85, seven_day = 0.93 }
# Caps: a run that hits one goes to "needs decision" instead of being retried, since a
# stuck run's late turns are its most expensive (its context only grows). The longest
# task so far took 49 turns.
agent_timeout = 5400      # hard cap on one agent run (seconds)
# Resume an agent's previous session only if it ended this recently (seconds); an older
# session is re-cached whole and carries stale context, so a fresh one starts instead.
resume_within_seconds = 3000
# Most tasks the planner may batch into one agent run and PR (each task otherwise costs
# a full session and a full review). 1 turns batching off.
max_batch = 4

# The only MCP servers agents get (none): headless runs otherwise load the user's own
# servers and connectors (mail, drive, browser), which unattended agents shouldn't have.
# Example: [mcp_servers.serena] command = "..." args = [...]
[mcp_servers]

# Every agent may use Bash and PowerShell (Max, 2026-11-03), minus [permissions] deny.

[permissions]
# Denied for every agent; deny beats allow. Claude Code checks each part of a compound
# command (a && b, a; b) and resolves PowerShell aliases (ri, rm, del -> Remove-Item).
# These are guardrails against mistakes, not a sandbox: an interpreter one-liner
# (python -c "os.system(...)") still gets past them.
# Agents never need any of this: the dispatcher pushes, opens PRs, merges, tags and
# manages worktrees and branches; agents commit on the branch they are given.
deny = [
  # GitHub and remotes: gh is logged in as Max, so it could close, merge or delete.
  "Bash(gh:*)", "PowerShell(gh:*)",
  "Bash(git push:*)", "PowerShell(git push:*)",
  "Bash(git remote:*)", "PowerShell(git remote:*)",
  # git config: reads (git config core.autocrlf) stay allowed; global/system scope,
  # removals and the keys that redirect remotes, credentials or hooks do not.
  "Bash(git config --global:*)", "Bash(git config --system:*)", "Bash(git config --unset:*)",
  "Bash(git config --unset-all:*)", "Bash(git config --add:*)", "Bash(git config --replace-all:*)",
  "Bash(git config --remove-section:*)", "Bash(git config --rename-section:*)",
  "Bash(git config --edit:*)", "Bash(git config -e:*)",
  # Prefixes match whole words only ("remote." would not catch remote.origin.url), so
  # name the keys exactly. Tested live 2026-11-03.
  "Bash(git config remote.origin.url:*)", "Bash(git config remote.origin.pushurl:*)",
  "Bash(git config remote.origin.fetch:*)", "Bash(git config user.name:*)",
  "Bash(git config user.email:*)", "Bash(git config credential.helper:*)",
  "Bash(git config core.hooksPath:*)", "Bash(git config core.sshCommand:*)",
  "Bash(git config http.extraHeader:*)", "Bash(git config include.path:*)",
  "PowerShell(git config --global:*)", "PowerShell(git config --system:*)",
  "PowerShell(git config --unset:*)", "PowerShell(git config remote.origin.url:*)",
  "PowerShell(git config remote.origin.pushurl:*)", "PowerShell(git config credential.helper:*)",
  "PowerShell(git config core.hooksPath:*)",
  # Branches, worktrees, tags and history (git restore covers undoing a file).
  "Bash(git checkout:*)", "PowerShell(git checkout:*)",
  "Bash(git switch:*)", "PowerShell(git switch:*)",
  # git branch: listing stays allowed; deleting, renaming and force-moving do not.
  "Bash(git branch -d:*)", "Bash(git branch -D:*)", "Bash(git branch --delete:*)",
  "Bash(git branch -m:*)", "Bash(git branch -M:*)", "Bash(git branch --move:*)",
  "Bash(git branch -f:*)", "Bash(git branch --force:*)",
  "PowerShell(git branch -d:*)", "PowerShell(git branch -D:*)", "PowerShell(git branch -m:*)",
  "PowerShell(git branch -M:*)", "PowerShell(git branch -f:*)",
  "Bash(git worktree:*)", "PowerShell(git worktree:*)",
  "Bash(git tag:*)", "PowerShell(git tag:*)",
  "Bash(git reset --hard:*)", "PowerShell(git reset --hard:*)",
  "Bash(git clean:*)", "PowerShell(git clean:*)",
  "Bash(git rebase:*)", "PowerShell(git rebase:*)",
  "Bash(git filter-branch:*)", "Bash(git update-ref:*)",
  "Bash(git reflog expire:*)", "Bash(git reflog delete:*)",
  "Bash(git stash drop:*)", "Bash(git stash clear:*)",
  # Deletes are allowed, recursive ones too (Max, 2026-11-05): agents clean up scratch in
  # their own worktree. A prefix rule can't limit a delete to one directory, so the
  # prompts carry the "only inside your worktree" rule.
  # Processes and the machine: the dispatcher and other sessions run on this desktop.
  "Bash(kill:*)", "Bash(pkill:*)", "Bash(killall:*)", "Bash(taskkill:*)",
  "PowerShell(Stop-Process:*)", "PowerShell(taskkill:*)",
  "Bash(shutdown:*)", "PowerShell(shutdown:*)", "PowerShell(Stop-Computer:*)", "PowerShell(Restart-Computer:*)",
  "Bash(format:*)", "Bash(diskpart:*)", "Bash(reg:*)", "PowerShell(reg:*)",
  "PowerShell(Set-ExecutionPolicy:*)", "PowerShell(Remove-ItemProperty:*)",
  # System-wide installs.
  "Bash(winget:*)", "PowerShell(winget:*)", "Bash(choco:*)", "PowerShell(choco:*)",
  "Bash(npm install -g:*)", "Bash(npm i -g:*)",
  # Wrappers that hide a command from the checks above.
  "Bash(bash -c:*)", "Bash(sh -c:*)", "Bash(eval:*)", "Bash(cmd:*)", "Bash(cmd.exe:*)",
  "Bash(powershell:*)", "Bash(pwsh -c:*)", "Bash(pwsh -Command:*)",
  "PowerShell(Invoke-Expression:*)", "PowerShell(iex:*)", "PowerShell(Start-Process:*)",
  "PowerShell(cmd:*)", "PowerShell(bash:*)",
]

[agents.planner]
model = "claude-opus-5-5"
max_turns = 60
tools = ["Read", "Glob", "Grep", "Bash", "PowerShell"]

[agents.implementer]
model = "claude-opus-5-5"
max_turns = 100
tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash", "PowerShell"]

[agents.reviewer]
model = "claude-opus-5-5"
max_turns = 60
# Edit is for test probes (deliberate breaks) in its disposable checkout.
tools = ["Read", "Edit", "Glob", "Grep", "Bash", "PowerShell"]

# ---------------------------------------------------------------- targets
# changes: a list of OpenSpec change names, or "*" for every non-archived change.
# test: the gate. It must exit 0 before review and again after merging the base branch.
# mutation (optional): extra evidence for the reviewer; {diff} is the PR's diff, relative
#   to project_dir. cargo-mutants runs --in-place in the reviewer's throwaway checkout, so it
#   reuses the gate's warm build and never copies the tree to %TEMP% (C:). The gate has just
#   passed on the same commit, hence --baseline skip; --timeout caps each mutant instead.

[targets.dota]
repo_root = "E:/Source/Claude"
github_repo = "MaximilianHoglund/PoEEyes"
changes = ["dota2-draft-helper"]
project_dir = "dota"
test = "cargo test --workspace"
# preflight: commands that must exit 0 from the dispatcher's shell (cmd) and from an
# agent's Bash and PowerShell tools before any agent runs; preflight_gate also runs the
# gate on the base branch. Keep them valid in all three shells.
preflight = ["cargo --version"]
preflight_gate = true
mutation = "cargo mutants --in-place --in-diff {diff} --baseline skip --timeout 60 --no-shuffle"
mutation_timeout = 1800

[targets.riftbound]
repo_root = "E:/Source/Claude"
github_repo = "MaximilianHoglund/PoEEyes"
changes = ["riftbound-footage-replay", "riftbound-full-card-database", "riftbound-gui",
           "riftbound-learned-agent", "riftbound-opponent-modelling"]
project_dir = "riftbound"
test = "pwsh -NoProfile -File scripts/check.ps1 -Fast"
preflight = ["cargo --version", 'pwsh -NoProfile -Command "exit 0"']
# No preflight_gate: the gate takes over an hour here.
test_timeout = 5400
# No mutation run: the gate alone takes long here, and in-place mutants run serially.

[targets.arpg]
repo_root = "E:/Source/arpg-manager"
github_repo = "MaximilianHoglund/arpg-manager"
# Agents work on dev; each finished roadmap step is merged into main, tagged and released
# for a human to play and test.
base = "dev"
release_branch = "main"
# Each release carries the playable build. project-foundation 4.1 (in step 1) adds the script,
# so it exists by the first release.
release_build = "pwsh -NoProfile -File scripts/export.ps1"
release_assets = ["dist/windows/arpg-manager.exe", "dist/windows/arpg-manager.pck",
                  "dist/windows/arpg_bridge.dll"]
changes = "*"
project_dir = "."
# Gate, first match wins: scripts/check.ps1 once project-foundation 3.3 adds it (Rust and
# Godot checks); else cargo test once 1.1 creates the workspace; else pass, so tasks
# merged before the workspace exists (e.g. 1.2's setup scripts) aren't failed for it.
test = '''pwsh -NoProfile -Command "if (Test-Path scripts/check.ps1) { & ./scripts/check.ps1; exit $LASTEXITCODE } elseif (Test-Path Cargo.toml) { cargo test --workspace; exit $LASTEXITCODE } else { Write-Output 'No Cargo.toml or scripts/check.ps1 yet: nothing to gate.'; exit 0 }"'''
mutation = '''pwsh -NoProfile -Command "if (Test-Path Cargo.toml) { cargo mutants --in-place --in-diff '{diff}' --baseline skip --timeout 60 --no-shuffle } else { Write-Output 'No Cargo.toml yet: no mutation run.' }"'''
mutation_timeout = 1800
context = ["docs/design.md", "docs/decisions.md", "docs/roadmap.md", "docs/agent-environment.md"]
# Godot 4.7.2 in self-contained mode, with export templates, preinstalled off the repo.
# PATH: agents' Git Bash otherwise can't find pwsh (a Store app alias in WindowsApps).
# Ticket #217: slots reuse a target dir across branches; clean the game's crates first.
clean_workspace_crates = true
env = { GODOT ="E:/Programs/Godot/4.7.2/Godot_v4.7.2-stable_win64_console.exe", PATH = "C:/Users/Max/AppData/Local/Microsoft/WindowsApps;{PATH}" }
preflight = ["cargo --version", 'pwsh -NoProfile -Command "exit 0"',
             "E:/Programs/Godot/4.7.2/Godot_v4.7.2-stable_win64_console.exe --version"]
preflight_gate = true

[[targets.arpg.milestones]]
tag = "step-1-watchable-combat"
title = "Step 1: Watchable combat"
changes = ["project-foundation", "combat-simulation", "strategy-rules", "run-viewer-and-reports"]
# Owner-play tasks: they wait for this release, and the release doesn't wait for them.
play = ["run-viewer-and-reports/4.2"]

[[targets.arpg.milestones]]
tag = "step-2-gear"
title = "Step 2: Gear"
changes = ["items-and-equipment", "loot-filter", "save-system"]

[[targets.arpg.milestones]]
