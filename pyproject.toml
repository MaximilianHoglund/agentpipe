[project]
name = "agentpipe"
version = "0.1.0"
description = "Multi-agent task pipeline: OpenSpec tasks -> GitHub issues -> implementer agents -> reviewer agent -> auto-merge"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
agentpipe = "agentpipe.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentpipe"]

[tool.setuptools.package-data]
agentpipe = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
